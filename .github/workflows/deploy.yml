name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # NOTE: package-lock.json in repo is incomplete (no resolved tree).
        # Deleting it here forces a clean npm install until the lockfile is
        # properly regenerated locally and committed.
        # TODO: Once a valid lockfile is committed, replace with `npm ci`.
        run: |
          rm -f package-lock.json
          npm install

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
