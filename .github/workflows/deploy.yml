name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Phone-only / no-local-machine POC: no lockfile can be generated
        # outside of CI. Delete the stub and regenerate fresh every run.
        run: |
          rm -f package-lock.json
          npm install

      - name: Commit regenerated lockfile
        # Commit the freshly resolved lockfile back to main.
        # [skip ci] prevents an infinite workflow trigger loop.
        # Once a valid lockfile is stable in the repo, this step becomes
        # a no-op (git diff --staged --quiet exits 0 and skips the commit).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "ci: regenerate package-lock.json [skip ci]"
          git push

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
